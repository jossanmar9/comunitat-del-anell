# Fa l'executable de Windows (LaComunitat.exe) amb PyInstaller.
# - En cada etiqueta v* (per exemple v1.4) el publica en una Release de GitHub.
# - També es pot llançar a mà des de la pestanya Actions («Run workflow»).
name: Executable de Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instal·la PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Regenera comunitat.py a partir de src/
        run: python build.py

      - name: Fa l'executable
        run: >
          pyinstaller --onefile --name LaComunitat --icon logo.ico
          --add-data "mapa-exemple-val.jpg;."
          --add-data "mapa-exemple-es.jpg;."
          comunitat.py

      - name: Prova que arranca
        shell: pwsh
        run: |
          $p = Start-Process dist\LaComunitat.exe -ArgumentList "--sense-navegador","--sense-qr","--port","8799" -PassThru
          Start-Sleep -Seconds 6
          $r = Invoke-WebRequest http://localhost:8799/api/hello -UseBasicParsing
          if ($r.StatusCode -ne 200) { throw "El servidor no respon" }
          $m = Invoke-WebRequest "http://localhost:8799/mapa?lang=es" -UseBasicParsing
          if ($m.StatusCode -ne 200) { throw "No troba el mapa d'exemple" }
          Stop-Process -Id $p.Id

      - name: Empaqueta
        shell: pwsh
        run: |
          New-Item -ItemType Directory LaComunitat | Out-Null
          Copy-Item dist\LaComunitat.exe, README.md, README.es.md, LICENSE LaComunitat\
          Copy-Item docs\Guia-La-Comunitat.pdf, docs\Guia-La-Comunidad.pdf LaComunitat\
          Compress-Archive LaComunitat\* LaComunitat-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: LaComunitat-windows
          path: LaComunitat-windows.zip

      - name: Publica la Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: LaComunitat-windows.zip
          generate_release_notes: true
