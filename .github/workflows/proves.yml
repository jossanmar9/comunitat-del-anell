# Comprova cada canvi que es puja a main: que comunitat.py es genera, que no falta cap traducció
# i que passen les proves del programa, del magatzem (partides, historial, còpies, exportar i importar)
# i de l'app en un navegador, tant la versió d'escriptori com la web/Android.
name: Proves

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proves:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.8", "3.13"]
        exclude:
          - os: windows-latest
            python: "3.8"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Genera comunitat.py
        run: python build.py
      - name: Comprova les traduccions
        run: python eines/comprova-traduccions.py
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Proves del programa
        run: |
          python tests/prova_servidor.py
          python tests/prova_persistencia.py
          python tests/prova_magatzem.py

  navegador:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Prepara el navegador
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Prova l'app (escriptori i web)
        run: |
          python build.py
          python tests/prova_app.py
