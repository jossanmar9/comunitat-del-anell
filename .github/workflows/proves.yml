# Comprova cada canvi que es puja a main: que comunitat.py es genera, que no falta cap traducció
# i que passen les proves del servidor (partides, historial, còpies, exportar i importar…).
name: Proves

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proves:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.8", "3.13"]
        exclude:
          - os: windows-latest
            python: "3.8"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Genera comunitat.py
        run: python build.py
      - name: Comprova les traduccions
        run: python eines/comprova-traduccions.py
      - name: Proves del servidor
        run: |
          python tests/prova_servidor.py
          python tests/prova_persistencia.py

  navegador:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Prepara el navegador
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Genera i prova dues sessions
        run: |
          python build.py
          python tests/prova_navegador.py
